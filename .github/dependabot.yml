version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
