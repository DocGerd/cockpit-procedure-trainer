name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Dependency install and build run here, without write or signing
  # permissions; only the release job can mint an OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
      exists: ${{ steps.existing.outputs.exists }}
      asset: ${{ steps.pack.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the top released section of CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="$(awk -F'[][]' '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ { print $2; exit }' CHANGELOG.md)"
          if [ -z "$version" ]; then
            echo "::error::CHANGELOG.md has no released section"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            /^\[[^]]*\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release/notes.md"; then
            echo "::error::section [$version] is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the Release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view.err")"; then
            if [ "$is_draft" = true ]; then
              echo "::error::Release $TAG is a draft, likely left by an interrupted run; delete it and re-run"
              exit 1
            fi
            echo "Release $TAG exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qx 'release not found' "$RUNNER_TEMP/view.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::could not look up Release $TAG"
            exit 1
          fi
      # The bundle is built and signed before the Release is created, so a failed
      # build or attestation leaves no Release and a re-run starts clean.
      - uses: pnpm/action-setup@v6
        if: steps.existing.outputs.exists == 'false'
      # No pnpm cache: a cache written by another branch's run must not feed a
      # signed bundle.
      - uses: actions/setup-node@v7
        if: steps.existing.outputs.exists == 'false'
        with:
          node-version: 24
      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      - name: Build the production bundle
        if: steps.existing.outputs.exists == 'false'
        env:
          BASE_PATH: /cockpit-procedure-trainer/
          VITE_DEPLOY_ENV: prod
        run: |
          set -euo pipefail
          VITE_BUILD_SHA="$(git rev-parse HEAD)" pnpm build
          grep -q "src=\"${BASE_PATH}assets/" apps/web/dist/index.html
          printf '{"commit":"%s"}\n' "$(git rev-parse HEAD)" > apps/web/dist/version.json
      - name: Pack the bundle deterministically
        if: steps.existing.outputs.exists == 'false'
        id: pack
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          asset="cockpit-procedure-trainer-${VERSION}.tar.gz"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C apps/web/dist -cf - . | gzip -9n > "$RUNNER_TEMP/release/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.existing.outputs.exists == 'false'
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Attest the bundle (keyless Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/${{ needs.build.outputs.asset }}
      # gh does not retry a lookup that finds no attestation yet.
      - name: Verify the attestation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$RUNNER_TEMP/release/$ASSET" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners; then
              exit 0
            fi
            echo "attempt $attempt: attestation did not verify"
            [ "$attempt" -lt 5 ] && sleep 20
          done
          echo "::error::the attestation for $ASSET did not verify"
          exit 1
      - name: Create tag and Release with the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP/release/$ASSET" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release/notes.md" --latest
