name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the top released section of CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="$(awk -F'[][]' '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ { print $2; exit }' CHANGELOG.md)"
          if [ -z "$version" ]; then
            echo "::error::CHANGELOG.md has no released section"
            exit 1
          fi
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            /^\[[^]]*\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::section [$version] is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the Release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The bundle is built and signed before the Release is created, so a failed
      # build or attestation leaves no Release and a re-run starts clean.
      - uses: pnpm/action-setup@v6
        if: steps.existing.outputs.exists == 'false'
      - uses: actions/setup-node@v7
        if: steps.existing.outputs.exists == 'false'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      - name: Build the production bundle
        if: steps.existing.outputs.exists == 'false'
        env:
          BASE_PATH: /cockpit-procedure-trainer/
          VITE_DEPLOY_ENV: prod
        run: |
          set -euo pipefail
          VITE_BUILD_SHA="$(git rev-parse HEAD)" pnpm build
          grep -q "src=\"${BASE_PATH}assets/" apps/web/dist/index.html
          printf '{"commit":"%s"}\n' "$(git rev-parse HEAD)" > apps/web/dist/version.json
      - name: Pack the bundle deterministically
        if: steps.existing.outputs.exists == 'false'
        id: pack
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/cockpit-procedure-trainer-${VERSION}.tar.gz"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C apps/web/dist -cf - . | gzip -9n > "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Attest the bundle (keyless Sigstore)
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.asset }}
      - name: Verify the attestation before publishing
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          set -euo pipefail
          gh attestation verify "$ASSET" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Create tag and Release with the signed bundle
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
